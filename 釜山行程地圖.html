<!doctype html><html lang="zh-Hant-TW"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><style>body{margin:0}</style></head><body>
<title>築遠釜山五日行程地圖</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&family=Noto+Sans+TC:wght@400;500;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* 版面：桌機為「左側行程欄＋右側地圖」單畫面；手機改為地圖在上、行程在下。
   色彩：海面灰藍、陸地米白，五天各一個辨識色。 */
:root {
  --sea: #c8dadf; --land: #f6f4ee; --land-hi: #ece4d3; --land-line: #c4bba9;
  --paper: #f8f9f8; --panel: #ffffff; --ink: #17242c; --muted: #5a6970; --line: #dce3e4;
  --accent: #0f4c5c; --on-accent: #ffffff; --on-day: #ffffff;
  --d1: #d9480f; --d2: #b4234a; --d3: #1971c2; --d4: #7b3fd1; --d5: #2f8a3e;
  --shadow: 0 6px 24px rgb(15 40 50 / .16);
  --f-display: "LXGW WenKai TC", "Kaiti TC", "DFKai-SB", serif;
  --f-body: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --sea: #0d1a20; --land: #1b2930; --land-hi: #23363e; --land-line: #364a53;
  --paper: #11191d; --panel: #18232a; --ink: #e6ecee; --muted: #94a4ab; --line: #26353c;
  --accent: #6cc0d0; --on-accent: #0d1a20; --on-day: #0d1a20;
  --d1: #ff8a50; --d2: #f2668b; --d3: #5cb3f7; --d4: #b08cf2; --d5: #67c879;
  --shadow: 0 6px 24px rgb(0 0 0 / .45); color-scheme: dark;
} }
:root[data-theme="dark"] {
  --sea: #0d1a20; --land: #1b2930; --land-hi: #23363e; --land-line: #364a53;
  --paper: #11191d; --panel: #18232a; --ink: #e6ecee; --muted: #94a4ab; --line: #26353c;
  --accent: #6cc0d0; --on-accent: #0d1a20; --on-day: #0d1a20;
  --d1: #ff8a50; --d2: #f2668b; --d3: #5cb3f7; --d4: #b08cf2; --d5: #67c879;
  --shadow: 0 6px 24px rgb(0 0 0 / .45); color-scheme: dark;
}
*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; }
body { background: var(--paper); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.6; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.app { height: 100%; display: grid; grid-template-columns: minmax(320px, 400px) 1fr; grid-template-rows: auto 1fr; }
header {
  grid-column: 1 / -1; display: flex; flex-wrap: wrap; align-items: center; gap: 10px 20px;
  padding-block: 12px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  border-bottom: 1px solid var(--line); background: var(--panel);
}
.brand { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; margin-right: auto; }
.brand h1 { margin: 0; font-family: var(--f-display); font-weight: 700; font-size: 26px; letter-spacing: .04em; text-wrap: balance; }
.brand span { color: var(--muted); font-size: 13px; }
.tabs { display: flex; gap: 6px; flex-wrap: wrap; }
.tab {
  border: 1px solid var(--line); background: transparent; border-radius: 999px; padding: 4px 12px; font-size: 14px;
  display: inline-flex; align-items: center; gap: 6px;
}
.tab i { width: 8px; height: 8px; border-radius: 50%; background: var(--c, var(--muted)); }
.tab[aria-selected="true"] { background: var(--c, var(--accent)); border-color: var(--c, var(--accent)); color: var(--on-day); }
.tab[aria-selected="true"] i { background: var(--on-day); }
.info-btn { border: 0; background: var(--accent); color: var(--on-accent); border-radius: 8px; padding: 6px 14px; font-weight: 500; }

/* 左側行程欄 */
aside {
  overflow-y: auto; background: var(--panel); border-right: 1px solid var(--line);
  padding-block: 18px 28px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: 16px; min-width: 0;
}
.eyebrow { font-size: 12px; letter-spacing: .12em; color: var(--c, var(--muted)); font-weight: 700; }
aside h2 { margin: 2px 0 6px; font-family: var(--f-display); font-size: 24px; line-height: 1.35; text-wrap: balance; }
.dates { color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; }
.route { font-size: 13px; color: var(--muted); margin: 8px 0 0; }
.sec { margin-top: 20px; }
.sec h3 { margin: 0 0 8px; font-size: 12px; letter-spacing: .12em; color: var(--muted); font-weight: 700; }
ol.stops { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
.stop {
  width: 100%; display: grid; grid-template-columns: 30px 1fr; gap: 10px; align-items: start; text-align: left;
  border: 0; background: transparent; padding: 8px; border-radius: 10px;
}
.stop:hover { background: var(--paper); }
.stop.on { background: color-mix(in srgb, var(--c) 12%, transparent); }
.num {
  width: 26px; height: 26px; border-radius: 50%; background: var(--c); color: var(--on-day);
  display: grid; place-items: center; font: 500 13px/1 var(--f-mono); margin-top: 1px;
}
.num.ghost { background: transparent; color: var(--c); border: 1.5px dashed var(--c); }
.num.sq { border-radius: 7px; background: var(--ink); color: var(--panel); }
.stop b { display: block; font-weight: 700; font-size: 15px; }
.stop small { display: block; color: var(--muted); font-size: 12.5px; line-height: 1.45; }
.subhead { margin: 10px 0 2px; padding: 8px 8px 0; border-top: 1px dashed var(--line); font-size: 12px; letter-spacing: .1em; font-weight: 700; color: var(--d4); }
.subhead span { margin-left: 8px; font-weight: 400; letter-spacing: 0; color: var(--muted); }
.tips { margin: 0; padding-left: 1.2em; display: grid; gap: 6px; font-size: 13.5px; }
.flag { display: inline-block; font-size: 11px; color: var(--muted); border: 1px solid var(--line); border-radius: 4px; padding: 0 5px; margin-left: 6px; vertical-align: 1px; font-weight: 400; }
.meals { display: grid; grid-template-columns: auto 1fr; gap: 6px 12px; margin: 0; font-size: 14px; }
.meals dt { font-weight: 700; color: var(--muted); font-size: 13px; }
.meals dd { margin: 0; min-width: 0; }
.daycards { display: grid; gap: 10px; }
.daycard {
  text-align: left; border: 1px solid var(--line); background: var(--panel); border-radius: 12px; padding: 12px 14px;
  display: grid; gap: 2px; border-left: 4px solid var(--c);
}
.daycard:hover { border-color: var(--c); }
.daycard b { font-family: var(--f-display); font-size: 18px; }
.daycard span { font-size: 13px; color: var(--muted); }
.note { font-size: 12.5px; color: var(--muted); margin-top: 18px; line-height: 1.6; }

/* 地圖 */
.mapwrap { position: relative; overflow: hidden; background: var(--sea); min-width: 0; }
#map { width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; user-select: none; }
#map.dragging { cursor: grabbing; }
#map .land path { fill: var(--land); stroke: var(--land-line); stroke-width: .7; vector-effect: non-scaling-stroke; }
#map .land path.hi { fill: var(--land-hi); }
#map .rt { fill: none; stroke-width: 2.6; stroke-dasharray: 7 6; stroke-linecap: round; vector-effect: non-scaling-stroke; transition: opacity .3s; }
#map .rt.free { stroke-dasharray: 0.1 7; stroke-width: 4; }
#map .track { fill: none; stroke-width: 5; stroke-linecap: round; vector-effect: non-scaling-stroke; opacity: .55; }
#map .mk { cursor: pointer; transition: opacity .3s; }
#map .mk circle, #map .mk rect { stroke: var(--land); stroke-width: 2.5; }
#map .mk text { font: 500 12px var(--f-mono); fill: var(--on-day); text-anchor: middle; dominant-baseline: central; pointer-events: none; }
#map .mk.sel circle, #map .mk.sel rect { stroke: var(--ink); stroke-width: 2.5; }
#map .lbl text { font: 700 13px var(--f-body); fill: var(--ink); paint-order: stroke; stroke: var(--land); stroke-width: 4px; stroke-linejoin: round; pointer-events: none; }
#map .region text { font: 400 14px var(--f-display); fill: var(--muted); letter-spacing: .3em; text-anchor: middle; pointer-events: none; opacity: .85; }
.dim { opacity: .14; }

.ctrls { position: absolute; top: 12px; right: max(12px, env(safe-area-inset-right, 0px)); display: grid; gap: 6px; }
.ctrls button {
  width: 36px; height: 36px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel);
  font-size: 18px; line-height: 1; box-shadow: var(--shadow);
}
.scale { position: absolute; left: 14px; bottom: 12px; font: 500 11px var(--f-mono); color: var(--ink); }
.scale div { height: 6px; border: 1.5px solid var(--ink); border-top: 0; margin-top: 2px; }
.credit { position: absolute; right: max(12px, env(safe-area-inset-right, 0px)); bottom: 10px; font-size: 11px; color: var(--muted); text-align: right; max-width: 60%; }

/* 景點資訊卡 */
.card {
  position: absolute; left: 14px; top: 14px; width: min(360px, calc(100% - 76px));
  background: var(--panel); border-radius: 14px; box-shadow: var(--shadow); padding: 14px 16px 14px; border-top: 4px solid var(--c);
}
.card .x { position: absolute; top: 6px; right: 8px; border: 0; background: transparent; font-size: 20px; color: var(--muted); width: 32px; height: 32px; }
.card h4 { margin: 2px 32px 0 0; font-family: var(--f-display); font-size: 21px; line-height: 1.3; }
.card .ko { color: var(--muted); font-size: 13px; }
.card p { margin: 8px 0 10px; font-size: 14px; }
.card .warn { font-size: 12.5px; color: var(--muted); border-left: 3px solid var(--line); padding-left: 8px; margin: 0 0 10px; }
.card a { color: var(--accent); font-weight: 500; font-size: 14px; }

/* 行前資訊 */
dialog {
  border: 0; padding: 0; width: min(720px, calc(100% - 32px)); max-height: calc(100% - 48px);
  background: var(--panel); color: var(--ink); border-radius: 16px; box-shadow: var(--shadow);
}
dialog::backdrop { background: rgb(10 20 25 / .5); }
.dlg-head { position: sticky; top: 0; background: var(--panel); display: flex; align-items: center; justify-content: space-between; padding: 16px 20px 10px; border-bottom: 1px solid var(--line); }
.dlg-head h2 { margin: 0; font-family: var(--f-display); font-size: 24px; }
.dlg-head button { border: 0; background: transparent; font-size: 22px; color: var(--muted); width: 36px; height: 36px; }
.dlg-body { padding: 8px 20px 24px; display: grid; gap: 22px; }
.dlg-body h3 { margin: 12px 0 8px; font-size: 13px; letter-spacing: .12em; color: var(--muted); }
.dlg-body ul { margin: 0; padding-left: 1.2em; display: grid; gap: 4px; }
.tbl { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 14px; font-variant-numeric: tabular-nums; }
th, td { text-align: left; padding: 6px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
th { font-size: 12px; color: var(--muted); font-weight: 700; }
td.mono { font-family: var(--f-mono); }
.check { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 4px 12px; }
.check label { display: flex; align-items: center; gap: 8px; font-size: 14px; padding: 3px 0; cursor: pointer; }
.check input:checked + span { color: var(--muted); text-decoration: line-through; }
.progress { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.phone { font-family: var(--f-mono); user-select: all; }

@media (max-width: 820px) {
  html, body { height: auto; }
  .app { height: auto; grid-template-columns: minmax(0, 1fr); grid-template-rows: auto auto auto; }
  header { min-width: 0; }
  .mapwrap { grid-row: 2; height: 58svh; min-height: 340px; }
  aside { grid-row: 3; border-right: 0; overflow: visible; padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .brand h1 { font-size: 22px; }
  .brand { flex: 1; min-width: 0; gap: 0 10px; }
  .info-btn { order: 2; }
  .tabs { order: 3; width: 100%; flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; }
  .tab { flex: none; }
  .card { top: auto; bottom: 34px; left: 10px; width: calc(100% - 20px); max-height: 60%; overflow-y: auto; }
  .credit { display: none; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

    <div class="card" id="card" hidden></div>
  </div>
</div>

<dialog id="info" aria-labelledby="infoTitle">

</dialog>

/* 標記 */
const markerEls = [];

/* ───────── 視圖（平移／縮放）───────── */
const size = () => ({ w: svg.clientWidth || 1, h: svg.clientHeight || 1 });
const FULL = { x: 0, y: 0, w: GEO.w, h: GEO.h };

function applyView() {
  const { w, h } = size(), v = state.view;
  // 限制縮放與平移，讓畫面不超出底圖資料範圍
  v.k = Math.min(Math.max(v.k, 0.008), GEO.w / w, GEO.h / h);
  v.cx = Math.min(Math.max(v.cx, w * v.k / 2), GEO.w - w * v.k / 2);
  v.cy = Math.min(Math.max(v.cy, h * v.k / 2), GEO.h - h * v.k / 2);
  svg.setAttribute("viewBox", `${v.cx - w * v.k / 2} ${v.cy - h * v.k / 2} ${w * v.k} ${h * v.k}`);
  const k = v.k;
  // 標記與文字維持固定螢幕大小
  const big = state.day !== 0;
  markerEls.forEach(m => {
    const s = big || m.p.kind ? k : k * 0.72;
    m.g.setAttribute("transform", `translate(${m.p.x},${m.p.y}) scale(${s})`);
  });
  regionEls.forEach(r => {
    r.g.setAttribute("transform", `translate(${r.x},${r.y}) scale(${k})`);
    r.g.style.display = (r.far ? k > 0.22 : k < 0.22) ? "" : "none";
  });
  placeLabels();
  // 比例尺：取接近 110px 的整數公里數
  const kmPer110 = 110 * k * KM_PER_UNIT;
  const nice = [0.2, 0.5, 1, 2, 5, 10, 20, 50].reduce((a, b) => Math.abs(b - kmPer110) < Math.abs(a - kmPer110) ? b : a);
  $("scale").querySelector("span").textContent = nice < 1 ? `${nice * 1000} m` : `${nice} km`;
  $("scale").querySelector("div").style.width = `${nice / KM_PER_UNIT / k}px`;
}

/* 標籤避讓：選取中的景點優先，其餘若與已放置的標籤重疊就略過 */
function placeLabels() {
  const L = $("labels"); L.textContent = "";
  if (state.day === 0 && !state.sel) return;
  const { w, h } = size(), v = state.view, k = v.k;
  const toScreen = p => [(p.x - v.cx) / k + w / 2, (p.y - v.cy) / k + h / 2];
  let cand = markerEls.filter(m => m.p.kind || m.p.day === state.day || m.p.key === state.sel);
  cand.sort((a, b) => (b.p.key === state.sel) - (a.p.key === state.sel) || (a.p.kind ? 1 : 0) - (b.p.kind ? 1 : 0));
  const boxes = cand.map(m => { const [sx, sy] = toScreen(m.p); return [sx - 12, sy - 12, sx + 12, sy + 12]; });
  const hit = (a, b) => a[0] < b[2] && a[2] > b[0] && a[1] < b[3] && a[3] > b[1];
  const placed = [];
  cand.forEach((m, i) => {
    const [sx, sy] = toScreen(m.p);
    if (sx < -50 || sy < -50 || sx > w + 50 || sy > h + 50) return;
    const tw = m.p.name.length * 13.5 + 6;
    const opts = [[sx + 16, sy - 9, sx + 16 + tw, sy + 9, "start", 16], [sx - 16 - tw, sy - 9, sx - 16, sy + 9, "end", -16]];
    const isSel = m.p.key === state.sel;
    const inView = o => o[0] > 4 && o[2] < w - 52;
    const free = o => !placed.some(b => hit(o, b)) && !boxes.some((b, j) => j !== i && hit(o, b));
    const ok = opts.find(o => inView(o) && (isSel || free(o))) || (isSel ? opts.find(inView) || opts[0] : null);
    if (!ok) return;
    placed.push(ok);
    const g = el("g", { class: "lbl", transform: `translate(${m.p.x},${m.p.y}) scale(${k})` }, L);
    const t = el("text", { x: ok[5], y: 5, "text-anchor": ok[4] }, g);
    t.textContent = m.p.name;
  });
}

function boundsFor(day) {
  const pts = day === 0 ? [...ALL.filter(s => !s.unplaced), PLACES.air, PLACES.hotel]
    : [...DAYS[day - 1].stops.filter(s => !s.unplaced), ...DAYS[day - 1].fit.map(k => PLACES[k])];
  const xs = pts.map(p => p.x), ys = pts.map(p => p.y);
  let b = [Math.min(...xs), Math.min(...ys), Math.max(...xs), Math.max(...ys)];
  const minSpan = 70; // 約 7.8 公里，避免單點時過度放大
  if (b[2] - b[0] < minSpan) { const c = (b[0] + b[2]) / 2; b[0] = c - minSpan / 2; b[2] = c + minSpan / 2; }
  if (b[3] - b[1] < minSpan) { const c = (b[1] + b[3]) / 2; b[1] = c - minSpan / 2; b[3] = c + minSpan / 2; }
  return b;
}
function viewFor(b) {
  const { w, h } = size(), pad = 56;
  const k = Math.max((b[2] - b[0]) / Math.max(w - pad * 2, 60), (b[3] - b[1]) / Math.max(h - pad * 2, 60));
  return { cx: (b[0] + b[2]) / 2, cy: (b[1] + b[3]) / 2, k };
}

/* 平滑移動：中心線性內插、縮放以對數內插 */
let anim = 0;
function flyTo(target, ms = 650) {
  cancelAnimationFrame(anim);
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) ms = 0;
  const from = { ...state.view }, t0 = performance.now();
  const ease = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
  const step = now => {
    const t = ms ? Math.min(1, (now - t0) / ms) : 1, e = ease(t);
    state.view = {
      cx: from.cx + (target.cx - from.cx) * e,
      cy: from.cy + (target.cy - from.cy) * e,
      k: Math.exp(Math.log(from.k) + (Math.log(target.k) - Math.log(from.k)) * e)
    };
    applyView();
    if (t < 1) anim = requestAnimationFrame(step);
  };
  anim = requestAnimationFrame(step);
}
const clampK = k => Math.min(Math.max(k, 0.008), 2.2);
function zoomAt(factor, sx, sy) {
  const { w, h } = size(), v = state.view;
  const nk = clampK(v.k * factor);
  const ux = v.cx + (sx - w / 2) * v.k, uy = v.cy + (sy - h / 2) * v.k;
  state.view = { k: nk, cx: ux - (sx - w / 2) * nk, cy: uy - (sy - h / 2) * nk };
  applyView();
}

/* 滑鼠拖曳、滾輪與雙指縮放 */
const pointers = new Map();
let dragStart = null, moved = false, pinch = null;
svg.addEventListener("pointerdown", e => {
  if (e.target.closest(".mk")) return;
  svg.setPointerCapture(e.pointerId);
  pointers.set(e.pointerId, [e.offsetX, e.offsetY]);
  cancelAnimationFrame(anim);
  moved = false;
  if (pointers.size === 1) dragStart = { x: e.offsetX, y: e.offsetY, ...state.view };
  if (pointers.size === 2) { const [a, b] = [...pointers.values()]; pinch = { d: Math.hypot(a[0] - b[0], a[1] - b[1]), k: state.view.k }; }
});

    zoomAt((pinch.k * pinch.d / d) / state.view.k, (a[0] + b[0]) / 2, (a[1] + b[1]) / 2);
    moved = true; return;
  }
  if (!dragStart) return;
  const dx = e.offsetX - dragStart.x, dy = e.offsetY - dragStart.y;
  if (Math.abs(dx) + Math.abs(dy) > 4) { moved = true; svg.classList.add("dragging"); }
  state.view = { k: dragStart.k, cx: dragStart.cx - dx * dragStart.k, cy: dragStart.cy - dy * dragStart.k };
  applyView();
});
const endPointer = e => {
  pointers.delete(e.pointerId);
  if (pointers.size < 2) pinch = null;
  if (pointers.size === 1) { const [p] = pointers.values(); dragStart = { x: p[0], y: p[1], ...state.view }; }
  if (pointers.size === 0) { dragStart = null; svg.classList.remove("dragging"); }
};
svg.addEventListener("pointerup", e => { const wasMoved = moved; endPointer(e); if (!wasMoved && pointers.size === 0 && state.sel) select(null); });
svg.addEventListener("pointercancel", endPointer);
svg.addEventListener("wheel", e => { e.preventDefault(); cancelAnimationFrame(anim); zoomAt(Math.exp(e.deltaY * 0.0015), e.offsetX, e.offsetY); }, { passive: false });
$("zin").onclick = () => { const { w, h } = size(); zoomAt(1 / 1.6, w / 2, h / 2); };
$("zout").onclick = () => { const { w, h } = size(); zoomAt(1.6, w / 2, h / 2); };
$("zfit").onclick = () => flyTo(viewFor(boundsFor(state.day)));
new ResizeObserver(() => applyView()).observe(svg);

/* ───────── 左欄與資訊卡 ───────── */
function renderTabs() {
  const tabs = [{ id: 0, t: "全程" }, ...DAYS.map(d => ({ id: d.id, t: `Day ${d.id}`, c: d.color }))];
  $("tabs").innerHTML = tabs.map(t =>
    `<button class="tab" role="tab" type="button" data-day="${t.id}" aria-selected="${state.day === t.id}" ${t.c ? `style="--c:${t.c}"` : ""}>${t.c ? "<i></i>" : ""}${t.t}</button>`).join("");
  $("tabs").querySelectorAll(".tab").forEach(b => b.onclick = () => setDay(+b.dataset.day));
}

function stopButton(p, color, label, cls = "") {
  const sub = p.unplaced ? "地點未載明，地圖上未標示" : [p.time, p.ko].filter(Boolean).join(" ・ ");
  const flag = p.guess ? `<span class="flag">地點待確認</span>` : "";
  return `<li><button class="stop ${state.sel === p.key ? "on" : ""}" type="button" data-key="${p.key}" style="--c:${color}" ${p.unplaced ? "disabled" : ""}>
    <span class="num ${cls}">${label}</span><span><b>${esc(p.name)}${flag}</b><small>${esc(sub)}</small></span></button></li>`;
}

function renderSide() {
  const side = $("side");
  if (state.day === 0) {
    side.innerHTML = `
      <div class="eyebrow">2026/11/14 – 11/18 ・ 2026/11/21 – 11/25</div>
      <h2>釜山・慶州五日行程</h2>
      <div class="dates">兩梯次出發，行程相同。點選天數查看當日路線。</div>
      <div class="sec daycards">${DAYS.map(d => `
        <button class="daycard" type="button" data-day="${d.id}" style="--c:${d.color}">
          <span class="eyebrow" style="--c:${d.color}">DAY ${d.id} ・ 週${d.wd} ${d.dates.join("／")}</span>
          <b>${d.title}</b><span>${esc(d.route)}</span>
        </button>`).join("")}</div>
      <div class="sec"><h3>住宿</h3><ol class="stops">${stopButton(PLACES.hotel, "var(--ink)", "H", "sq")}</ol></div>
      <p class="note">*時程僅供參考，出團時將依實際狀況由領隊機動調整。景點位置與路線為示意，非實際行車路線。</p>`;
    side.querySelectorAll(".daycard").forEach(b => b.onclick = () => setDay(+b.dataset.day));
  } else {
    const d = DAYS[state.day - 1];
    const from = PLACES[d.from], to = PLACES[d.to];
    side.innerHTML = `
      <div class="eyebrow" style="--c:${d.color}">DAY ${d.id} ・ 週${d.wd}</div>
      <h2>${d.title}</h2>
      <div class="dates">第一梯 2026/${d.dates[0]} ・ 第二梯 2026/${d.dates[1]}</div>
      <p class="route">${esc(d.route)}</p>
      <div class="sec"><h3>行程順序</h3><ol class="stops">
        ${stopButton(from, from.kind === "hotel" ? "var(--ink)" : "var(--accent)", from.kind === "hotel" ? "H" : "✈", from.kind === "hotel" ? "sq" : "")}
        ${d.stops.map((s, i) => (s.free && !(d.stops[i - 1] || {}).free ? `<li class="subhead">半日自由行・自行前往<span>地圖上以點線表示</span></li>` : "")
          + stopButton(s, d.color, s.n, s.unplaced ? "ghost" : "")).join("")}
        ${stopButton(to, to.kind === "hotel" ? "var(--ink)" : "var(--accent)", to.kind === "hotel" ? "H" : "✈", to.kind === "hotel" ? "sq" : "")}
      </ol></div>
      ${d.freeNotes ? `<div class="sec"><h3>自由行交通與提醒</h3><ul class="tips">${d.freeNotes.map(t => `<li>${esc(t)}</li>`).join("")}</ul></div>` : ""}
      <div class="sec"><h3>餐食</h3><dl class="meals">${Object.entries(d.meals).map(([k, v]) => `<dt>${k}</dt><dd>${esc(v)}</dd>`).join("")}</dl></div>
      <p class="note">*時程僅供參考，出團時將依實際狀況由領隊機動調整。</p>`;
  }
  side.querySelectorAll(".stop[data-key]").forEach(b => b.onclick = () => select(b.dataset.key, true));
}

function renderCard() {
  const card = $("card"), p = state.sel && byKey(state.sel);
  if (!p) { card.hidden = true; return; }
  const d = p.day ? DAYS[p.day - 1] : null;
  const color = d ? d.color : (p.kind === "hotel" ? "var(--ink)" : "var(--accent)");
  const eyebrow = d ? `DAY ${d.id} ・ 第 ${p.n} 站` : (p.kind === "hotel" ? "住宿 ・ 全程不換宿" : "機場");
  const q = encodeURIComponent(p.ko || p.name);
  card.style.setProperty("--c", color);
  card.innerHTML = `
    <button class="x" type="button" aria-label="關閉">×</button>
    <div class="eyebrow" style="--c:${color}">${eyebrow}</div>
    <h4>${esc(p.name)}</h4>
    ${p.ko ? `<div class="ko">${esc(p.ko)}</div>` : ""}
    <p>${esc(p.desc)}</p>
    ${p.warn ? `<p class="warn">${esc(p.warn)}</p>` : ""}
    <a href="https://www.google.com/maps/search/?api=1&query=${q}" target="_blank" rel="noopener">在 Google 地圖開啟 ↗</a>`;
  card.hidden = false;
  card.querySelector(".x").onclick = () => select(null);
}

function paintFocus() {
  routeEls.forEach((g, i) => g.classList.toggle("dim", state.day !== 0 && state.day !== i + 1));
  const sp = state.sel && byKey(state.sel), selKey = sp && sp.at || state.sel; // 同址的站點改標示其共用標記
  markerEls.forEach(m => {
    const off = state.day !== 0 && !m.p.kind && m.p.day !== state.day;
    m.g.classList.toggle("dim", off);
    m.g.classList.toggle("sel", m.p.key === selKey);
  });
  // 讓選取中的標記畫在最上層
  const s = markerEls.find(m => m.p.key === selKey);
  if (s) $("markers").appendChild(s.g);
}

function setDay(day, fly = true) {
  state.day = day; state.sel = null;
  try { history.replaceState(null, "", day ? `#d${day}` : location.pathname + location.search); } catch (e) {}
  renderTabs(); renderSide(); renderCard(); paintFocus();
  if (fly) flyTo(viewFor(boundsFor(day))); else { state.view = viewFor(boundsFor(day)); applyView(); }
}

function select(key, pan = false) {
  const p = key && byKey(key);
  if (p && p.day && state.day !== 0 && p.day !== state.day) { state.day = p.day; renderTabs(); }
  state.sel = key;
  renderSide(); renderCard(); paintFocus(); applyView();
  if (p && pan) {
    const v = state.view, { w, h } = size();
    const sx = (p.x - v.cx) / v.k + w / 2, sy = (p.y - v.cy) / v.k + h / 2;
    // 只有標記被資訊卡遮住或在畫面外時才移動地圖
    const narrow = w < 560;
    const safe = narrow ? sy > 40 && sy < h * 0.42 && sx > 30 && sx < w - 30 : sx > 400 && sx < w - 60 && sy > 40 && sy < h - 40;
    if (!safe) flyTo({ k: v.k, cx: narrow ? p.x : p.x - Math.min(160, w * 0.18) * v.k, cy: narrow ? p.y + h * 0.2 * v.k : p.y }, 450);
    const li = $("side").querySelector(`.stop[data-key="${key}"]`);
    if (li && !narrow) li.scrollIntoView({ block: "nearest", behavior: "smooth" });
  }
}

  "薄毛衣", "厚外套", "薄羽絨服", "長袖上衣", "長褲／牛仔褲", "襪子", "內衣褲", "圍巾／手套", "帽子", "舒適鞋子", "雨傘／輕便雨衣", "簡便化妝包",

try { packed = JSON.parse(localStorage.getItem("busan-pack") || "{}"); } catch (e) { packed = {}; }

$("openInfo").onclick = () => { renderInfo(); $("info").showModal(); };
$("closeInfo").onclick = () => $("info").close();

setDay(m ? +m[1] : 0, false);
